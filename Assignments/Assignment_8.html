<!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks and Images</title>
</head>
<body>

    <h1>Hyperlinks and Images</h1>

    <h2>Internal Link</h2>
    <a href="#contact">Go to Contact Section</a>

    <h2>External Link</h2>
    <a href="https://www.google.com" target="_blank" title="Open Google">
        Visit Google
    </a>

    <h2>Email Link</h2>
    <a href="mailto:example@gmail.com">
        Send Email
    </a>

    <h2>Image Link</h2>
    <a href="https://www.google.com" target="_blank">
        <img src="https://www.w3schools.com/html/img_girl.jpg"
             alt="A girl standing outdoors"
             width="200"
             height="200">
    </a>

    <h2 id="contact">Contact Section</h2>
    <p>Welcome to the contact section.</p>

</body>
</html>
