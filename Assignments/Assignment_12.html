<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
</head>
<body>

    <table border="1">

        <caption>Student Marks</caption>

        <thead>
            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>101</td>
                <td>Akshat</td>
                <td>85</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Rahul</td>
                <td>90</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Aman</td>
                <td>80</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="2">Total Marks</th>
                <th>255</th>
            </tr>
        </tfoot>

    </table>

</body>
</html>
