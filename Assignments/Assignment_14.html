<!DOCTYPE html>
<html>
<head>
    <title>Nested and Responsive Tables</title>
</head>
<body>

    <table border="1">
        <tr>
            <th>Day</th>
            <th>Lab Batches</th>
            <th>Faculty</th>
            <th>Room</th>
            <th>Time</th>
        </tr>

        <tr>
            <td>Friday</td>

            <td>
                <table border="1">
                    <tr>
                        <th>Batch</th>
                        <th>System</th>
                    </tr>

                    <tr>
                        <td>A1</td>
                        <td>PC 1-20</td>
                    </tr>

                    <tr>
                        <td>A2</td>
                        <td>PC 21-40</td>
                    </tr>
                </table>
            </td>

            <td>Dr. Sharma</td>
            <td>Lab 2</td>
            <td>2-4 PM</td>
        </tr>
    </table>

</body>
</html>
