<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    table ,th,td{
        border: 1px solid black;
        border-collapse: collapse;  
    }
   </style>
</head>
<body>
    <h2> Cell that spans two columns</h2>
    <p> To make a cell span more than one column, use the colspan attribute.</p>
    <table style="width:50%">
        <tr>
            <th>Firstname</th>
            <th>Lastname</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Jill</td>
            <td>Smith</td>
            <td>50</td>
        </tr>
        <tr>
            <td colspan="2">John Doe</td>
            <td>30</td>
        </tr>
    </table>
<table style="width:50%">
        <tr>
            <th>Firstname</th>
            <th rowspan="2">Lastname</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Jane</td>
            <td>Doe</td>
            <td>25</td>
        </tr>
    </table>
</body>
</html>
