<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exp</title>
</head>
<body>
    
       <header style="text-align-last: center">
        <h1>Student Registration Form</h1>
         </header>
    <fieldset>
        <label for="name">Full Name:</label>
        <input type="text" name="name" id="name" placeholder="Enter your full name" required />
        <br> <br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter your email" required />
        <br><br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" placeholder="Enter your password" required />
        <br><br>
        <label for="gender">Gender</label>
        <input type="radio" name="gender" id="male" value="male" required /> 
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female" required />
        <label for="female">Female</label>
        <br><br>
        <label for="course">Course:</label>
        <select name="course" id="course" required>
            <option value="">--Select a course--</option>
            <option value="bca">BTECH</option>
            <option value="bsc">BCA</option>
            <option value="ba">BA</option>
        </select>
        <br><br>    
        <label for="contact">Contact Number:</label>
        <input type="tel" name="contact" id="contact" placeholder="Enter phone number" required />
        <br><br>
        <label for="address">Address:</label>
        <br><br>
        <textarea name="address" id="address" placeholder="Enter your address" required></textarea>
        <br><br>
        <input type="submit" value="Register" />
        <input type="Clear" value="Clear" />
    </fieldset>
    <p align="center"> &copy 2025 Student Registration Portal</p>
</body>
</html>
